# Build, install-test and release IR Remote packages.
#
# How it runs:
#   * Push a tag like v1.2.0  -> builds everything, tests everything, and (only if
#     all tests pass) creates the GitHub release with the files attached.
#   * "Run workflow" button (or: gh workflow run release.yml --ref BRANCH)
#     -> same builds and tests, but NO release: the files are kept as
#     downloadable "artifacts" on the workflow run page for a few days.
#
# Every distro gets two packages: elksmart-comm (the dongle tool + udev rule,
# x86_64) and irremote (the app, noarch). Every step calls a script in
# packaging/ that you can also run on your own PC (packaging/build-all.sh runs
# them all). Each distro's packages are built inside a fresh Docker container
# of that distro and then installed into another fresh one.
# See packaging/README.md for the whole release routine.

name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# By default the jobs may only read the repository. Only the final "release"
# job gets permission to create releases (see below).
permissions:
  contents: read

# Never run two release builds for the same tag/branch at the same time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Read the version, check it matches the tag, pack the source, and download
  #    the pinned elksmart-comm source once (checked against its commit IDs).
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read __version__ and check it against the tag
        id: ver
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VER=$(packaging/release-info.sh version)
          echo "__version__ in irremote/__init__.py: $VER"
          # On a tag push the tag must be exactly "v" + __version__; stop here if not.
          if [ "$REF_TYPE" = tag ]; then
            packaging/release-info.sh check "$REF_NAME"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Make the source tarball (git archive)
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p source
          git archive --format=tar.gz --prefix="irremote-$VER/" -o "source/irremote-$VER.tar.gz" HEAD
          ls -l source

      - name: Download the elksmart-comm source (pinned commit)
        run: packaging/fetch-elksmart-comm.sh source

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: source/
          if-no-files-found: error

  # 2. Build both packages per distro, each distro in a fresh container of its own.
  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # let the other distros finish even if one fails
      matrix:
        distro: [arch, debian-13, ubuntu-24.04, fedora-44, opensuse-tumbleweed]
    env:
      VER: ${{ needs.prepare.outputs.version }}
      DISTRO: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: source/
      - name: Build the ${{ matrix.distro }} packages
        run: |
          . packaging/elksmart-comm.sh
          packaging/build.sh "$DISTRO" "source/irremote-$VER.tar.gz" "source/elksmart-comm-$ELK_VER.tar.gz" "out/$DISTRO"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-${{ matrix.distro }}
          path: out/${{ matrix.distro }}/
          if-no-files-found: error

  # 3. Install both packages in a FRESH container of their distro and run packaging/test.sh.
  test:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, debian-13, ubuntu-24.04, fedora-44, opensuse-tumbleweed]
    env:
      VER: ${{ needs.prepare.outputs.version }}
      DISTRO: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkg-${{ matrix.distro }}
          path: built/
      - name: Install-test the ${{ matrix.distro }} packages
        run: packaging/test-in-container.sh "$DISTRO" built/pkg "$VER"

  # 4. Put every release file in one place with SHA256SUMS and the release notes.
  #    Runs on every run (also "Run workflow"), so a test run shows exactly what
  #    a release would contain: download the "release-files" artifact.
  assemble:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkg-*
          path: built/
      - name: Collect the files and write SHA256SUMS
        run: |
          mkdir -p release
          cp built/pkg-*/pkg/* release/
          (cd release && sha256sum -- * > SHA256SUMS)
          # 5 distros x 2 packages (elksmart-comm + irremote) + SHA256SUMS
          n=$(find release -type f | wc -l); [ "$n" -eq 11 ] || { echo "::error::expected 11 release files, got $n"; ls -l release; exit 1; }
          ls -l release; cat release/SHA256SUMS
      - name: Release notes
        run: |
          packaging/release-info.sh notes "v$VER" > release-notes.md
          packaging/release-info.sh title "v$VER" > release-title.txt
          echo "Title: $(cat release-title.txt)"; cat release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            release/
            release-notes.md
            release-title.txt
          if-no-files-found: error

  # 5. Create the GitHub release. Only for tag pushes, and only after every
  #    build and install test above has passed.
  release:
    if: github.ref_type == 'tag'
    needs: [prepare, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the release and upload files
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: .
      - name: Create the release
        run: |
          ls -l release
          # A published release for this tag already exists: stop, don't overwrite
          # files people may have downloaded. A leftover draft (an earlier run that
          # failed half-way) is finished instead.
          if state=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$state" = true ]; then
              echo "Draft release $TAG exists: uploading the files again and publishing it"
              gh release upload "$TAG" release/* --clobber
              gh release edit "$TAG" --title "$(cat release-title.txt)" --notes-file release-notes.md --draft=false
            else
              echo "::error::release $TAG is already published; delete it first (gh release delete $TAG) if you want to rebuild it"
              exit 1
            fi
          else
            gh release create "$TAG" release/* --verify-tag \
              --title "$(cat release-title.txt)" --notes-file release-notes.md
          fi
          gh release view "$TAG" --json url,assets -q '.url, (.assets[] | .name)'
