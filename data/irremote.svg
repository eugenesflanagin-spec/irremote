<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- SPDX-License-Identifier: MIT -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d5562"/>
      <stop offset="1" stop-color="#2b3038"/>
    </linearGradient>
  </defs>
  <!-- IR waves -->
  <g fill="none" stroke="#da4453" stroke-width="3" stroke-linecap="round">
    <path d="M24 12 Q32 5 40 12"/>
    <path d="M19 7 Q32 -4 45 7" opacity="0.6"/>
  </g>
  <!-- remote body -->
  <rect x="20" y="16" width="24" height="46" rx="7" fill="url(#body)" stroke="#1b1e24" stroke-width="1.5"/>
  <circle cx="32" cy="18.5" r="2" fill="#da4453"/>
  <!-- power button -->
  <circle cx="32" cy="27" r="4.5" fill="#da4453"/>
  <path d="M32 24.2 v3" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
  <!-- d-pad -->
  <circle cx="32" cy="40" r="6.5" fill="#3daee9"/>
  <circle cx="32" cy="40" r="2.5" fill="#eff0f1"/>
  <!-- small keys -->
  <g fill="#bdc3c7">
    <rect x="24" y="50" width="5" height="3.5" rx="1"/>
    <rect x="29.5" y="50" width="5" height="3.5" rx="1"/>
    <rect x="35" y="50" width="5" height="3.5" rx="1"/>
    <rect x="24" y="55" width="5" height="3.5" rx="1"/>
    <rect x="29.5" y="55" width="5" height="3.5" rx="1"/>
    <rect x="35" y="55" width="5" height="3.5" rx="1"/>
  </g>
</svg>
